<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - El Desvío</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background: #f4f7f6; padding: 20px; color: #333; margin: 0; }
        .hidden { display: none !important; }
        .contenedor { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #00bfff; }
        
        /* Estilos del Login */
        input[type="email"], input[type="password"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px;}
        button.btn-principal { width: 100%; padding: 12px; background: #00bfff; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px;}
        
        /* Estilos del Panel */
        button.logout { width: 100%; padding: 10px; background: #ff4c4c; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
        .categoria-header { background: #333; color: white; padding: 10px; border-radius: 5px; margin-top: 20px; text-transform: uppercase; font-size: 18px; }
        .producto-admin { border-bottom: 1px solid #eee; padding: 15px 0; display: flex; flex-direction: column; gap: 10px; }
        .producto-admin:last-child { border-bottom: none; }
        .prod-info strong { font-size: 18px; }
        .prod-actions { display: flex; gap: 10px; align-items: center; }
        input[type="number"] { width: 90px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; font-weight: bold;}
        .btn-update { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-toggle { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; flex: 1; }
        .disponible { background: #ffcc00; color: black; }
        .agotado { background: #e0e0e0; color: #555; }
    </style>
</head>
<body>

    <!-- Sección de Login -->
    <div id="login-section" class="contenedor">
        <h1>Acceso Dueños</h1>
        <form id="login-form">
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit" class="btn-principal">Ingresar</button>
            <p id="login-error" style="color: red; display: none; text-align: center; margin-top: 10px;">Credenciales incorrectas.</p>
        </form>
    </div>

    <!-- Sección de Administración -->
    <div id="admin-section" class="contenedor hidden">
        <h1>Panel de Control</h1>
        <button id="btn-logout" class="logout">Cerrar Sesión</button>
        <div id="productos-container">Cargando productos...</div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
